<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your result — Camp Verbal</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#06182e">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<main id="app" class="wrap"></main>

<script src="assets/config.js"></script>
<script src="assets/vendor/supabase-2.117.1.js"></script>
<script src="assets/core.js"></script>
<script>
(async function () {
  'use strict';
  const { esc, para, num, fmtDur, fmtIST } = CV;
  const app = document.getElementById('app');
  const KEYS = ['A', 'B', 'C', 'D', 'E', 'F'];
  if (!CV.configured) { CV.header(); return CV.notConfigured(app); }
  const user = await CV.requireUser();
  CV.header({ email: user.email, label: 'Results' });
  CV.loading(app, 'Marking your test…');

  let R;
  try { R = await CV.rpc('cv_review', { p_attempt: CV.qs.get('a') }); }
  catch (e) { app.innerHTML = `<div class="note bad">${esc(e.message)}</div><a class="btn mt1" href="index.html">Back to library</a>`; return; }

  const S = R.summary, T = R.test, QS = R.questions;
  document.title = T.title + ' — result — Camp Verbal';
  const attempted = S.correct + S.wrong;
  const acc = attempted ? Math.round(S.correct / attempted * 100) : 0;

  const outcome = q => {
    if (q.response == null || String(q.response).trim() === '') return 'skipped';
    if (q.kind === 'mcq') return +q.response === q.answer_index ? 'correct' : 'wrong';
    return titaNorm(q.response) === titaNorm(q.answer_text) ? 'correct' : 'wrong';
  };
  function titaNorm(v) {   // display only — the score itself comes from the server
    const s = String(v == null ? '' : v).trim(), t = s.replace(/[\s,]/g, '');
    return t !== '' && isFinite(t) ? String(Number(t)) : s.toLowerCase();
  }
  QS.forEach(q => q._o = outcome(q));

  // Breakdown rows, weakest first (by marks lost)
  const rows = obj => Object.entries(obj || {}).map(([k, v]) => ({ k, ...v, lost: v.max - v.score }))
    .sort((a, b) => b.lost - a.lost);
  const secRows = T.section_order.map(s => ({ k: s, ...(S.breakdown.sections[s] || {}) })).filter(r => r.max);
  const fmtRows = rows(S.breakdown.formats);
  const label = k => k.replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  const tbl = (list, head) => `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${head}</th><th class="num">Right</th><th class="num">Wrong</th><th class="num hide-m">Blank</th><th class="num">Score</th><th class="hide-m" style="width:28%">Of max</th></tr></thead><tbody>` +
    list.map(r => `<tr><td>${esc(label(r.k))}</td><td class="num">${r.correct}</td><td class="num">${r.wrong}</td><td class="num hide-m">${r.skipped}</td>
      <td class="num">${num(r.score)} / ${num(r.max)}</td><td class="hide-m"><div class="bar"><div style="width:${Math.max(0, r.score / r.max * 100)}%"></div></div></td></tr>`).join('') + '</tbody></table></div>';

  const timeUsed = QS.reduce((a, q) => a + (q.time_ms || 0), 0) / 1000;

  app.innerHTML = `
    <div class="spread no-print"><a class="btn btn-sm" href="index.html">← Library</a>
      <div class="row"><button class="btn btn-sm" id="pdf">Download PDF</button>
      <a class="btn btn-sm btn-gold" href="test.html?t=${encodeURIComponent(T.slug)}">Retake</a></div></div>
    <p class="eyebrow mt2">${esc(T.exam_name)} · Attempt ${S.attempt_no}${S.is_first ? ' · <span style="color:var(--gold)">scored attempt</span>' : ' · practice'}</p>
    <h1>${esc(T.title)}</h1>
    <p class="sub">${esc(user.email)} · submitted ${esc(fmtIST(S.submitted_at))}${S.auto_submitted ? ' · submitted automatically when time ran out' : ''}</p>

    <section class="card mt2 scorebox">
      <div class="bigscore">${num(S.score)}<small> / ${S.max_marks}</small></div>
      <div class="stats">
        <div class="stat"><b style="color:var(--ok)">${S.correct}</b><span>Correct</span></div>
        <div class="stat"><b style="color:var(--bad)">${S.wrong}</b><span>Wrong</span></div>
        <div class="stat"><b>${S.skipped}</b><span>Left blank</span></div>
        <div class="stat"><b>${acc}%</b><span>Accuracy</span></div>
      </div>
    </section>
    <p class="small muted mt1">Time taken: ${fmtDur(S.time_taken_sec)} · time on questions: ${fmtDur(timeUsed)} · marking +${T.marking.c} / ${T.marking.w}${T.marking.titaW !== undefined && T.marking.titaW !== T.marking.w ? ` (type-in wrong: ${T.marking.titaW})` : ''}</p>

    ${secRows.length > 1 ? `<h2 class="mt3">By section</h2><div class="mt1">${tbl(secRows, 'Section')}</div>` : ''}
    ${fmtRows.length > 1 ? `<h2 class="mt3">By question type</h2><p class="small muted">Sorted by marks lost — start your revision at the top.</p><div class="mt1">${tbl(fmtRows, 'Type')}</div>` : ''}

    <div class="spread mt3"><h2>Review</h2>
      <div class="filters no-print" id="flt">
        <button class="btn btn-sm on" data-f="all">All ${QS.length}</button>
        <button class="btn btn-sm" data-f="wrong">Wrong ${S.wrong}</button>
        <button class="btn btn-sm" data-f="skipped">Blank ${S.skipped}</button>
        <button class="btn btn-sm" data-f="marked">Marked ${QS.filter(q => q.marked).length}</button>
      </div></div>
    <div id="rv" class="mt1"></div>`;

  let lastPassage = null;
  const card = (q, i) => {
    const showPassage = q.passage && q.passage !== lastPassage; lastPassage = q.passage || lastPassage;
    const tag = { correct: '<span class="badge b-ok">Correct</span>', wrong: '<span class="badge b-bad">Wrong</span>', skipped: '<span class="badge">Left blank</span>' }[q._o];
    let body;
    if (q.kind === 'mcq') {
      body = q.options.map((o, k) => {
        const key = k === q.answer_index, mine = q.response != null && +q.response === k;
        const cls = ['ropt', key ? 'is-key' : '', mine ? 'is-mine' : '', mine && !key ? 'is-wrong' : ''].join(' ');
        const t = key && mine ? 'Your answer ✓' : key ? 'Correct answer' : mine ? 'Your answer' : '';
        return `<div class="${cls}"><span class="k">${KEYS[k]}</span><span>${esc(o)}</span>${t ? `<span class="tag" style="color:${key ? 'var(--ok)' : 'var(--bad)'}">${t}</span>` : ''}</div>`;
      }).join('');
    } else {
      body = `<div class="ropt ${q._o === 'correct' ? 'is-key' : 'is-mine is-wrong'}"><span>Your answer: <b>${q.response ? esc(q.response) : '—'}</b></span></div>
              ${q._o !== 'correct' ? `<div class="ropt is-key"><span>Correct answer: <b>${esc(q.answer_text)}</b></span></div>` : ''}`;
    }
    return `<article class="rq ${q._o}" data-o="${q._o}" data-m="${q.marked ? 1 : 0}">
      ${showPassage ? `<details class="pass"><summary>Passage</summary><div>${para(q.passage)}</div></details>` : ''}
      <div class="qhead"><span class="qnum">Q${i + 1} <span class="muted small">${esc(q.section)}${q.format ? ' · ' + esc(label(q.format)) : ''}</span></span>
        <span class="row">${q.marked ? '<span class="badge" style="color:#b48cff">Marked</span>' : ''}${tag}<span class="tiny muted">${fmtDur(q.time_ms / 1000)}</span></span></div>
      <div class="stem">${para(q.stem)}</div>
      ${q.fig ? `<div class="figure">${q.fig}</div>` : ''}${q.table ? `<div class="figure">${q.table}</div>` : ''}
      <div class="mt1">${body}</div>
      ${q.explanation ? `<div class="expl"><b>Why:</b> ${para(q.explanation)}</div>` : ''}
    </article>`;
  };
  document.getElementById('rv').innerHTML = QS.map(card).join('');

  document.getElementById('flt').addEventListener('click', e => {
    const f = e.target.getAttribute && e.target.getAttribute('data-f'); if (!f) return;
    document.querySelectorAll('#flt .btn').forEach(b => b.classList.toggle('on', b === e.target));
    document.querySelectorAll('.rq').forEach(el => {
      el.hidden = !(f === 'all' || el.dataset.o === f || (f === 'marked' && el.dataset.m === '1'));
    });
  });
  document.getElementById('pdf').addEventListener('click', () => {
    document.querySelectorAll('.rq').forEach(el => el.hidden = false);
    document.querySelectorAll('details.pass').forEach(d => d.open = true);
    window.print();
  });
})();
</script>
</body>
</html>
